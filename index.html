<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnotherCesiumSkybox — BillboardCollection 星空</title>
    <!-- 固定近期 Cesium 版本（CDN，无需 npm） -->
    <link
      rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"
    />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 10;
        color: #e8eef7;
        font: 13px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: rgba(0, 8, 20, 0.55);
        padding: 10px 12px;
        border: 1px solid rgba(160, 190, 230, 0.25);
        max-width: min(360px, calc(100vw - 24px));
        pointer-events: none;
      }
      #hud strong {
        color: #9fd0ff;
      }
      #status {
        margin-top: 6px;
        opacity: 0.9;
      }
      #status.error {
        color: #ffb4b4;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="hud">
      <div><strong>AnotherCesiumSkybox</strong></div>
      <div>用 BillboardCollection 替换默认 SkyBox 星空</div>
      <div id="status">正在加载星表…</div>
    </div>

    <script type="module">
      import { createStarfield } from "./js/starfield.js";

      // 本演示不依赖 Cesium Ion token（无默认影像 / 无地形）
      const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: true,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: true,
        infoBox: false,
        selectionIndicator: false,
        // 新版 Cesium：关闭默认底图，避免强制 Ion
        baseLayer: false,
        skyBox: false,
        skyAtmosphere: false,
        orderIndependentTranslucency: true,
      });

      viewer.scene.backgroundColor = Cesium.Color.BLACK;
      viewer.scene.globe.enableLighting = false;
      viewer.scene.globe.baseColor = new Cesium.Color(0.02, 0.05, 0.12, 1);
      viewer.scene.globe.showGroundAtmosphere = false;
      viewer.scene.moon = undefined;
      viewer.scene.sun = undefined;
      viewer.scene.fog.enabled = false;

      // 拉远一点，方便看到星空包围地球
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(110, 20, 2.2e7),
      });

      const statusEl = document.getElementById("status");

      try {
        const { stats } = await createStarfield(viewer, {
          inertialLock: true,
        });
        statusEl.textContent =
          `已加载恒星 ${stats.starCount} · 星系 ${stats.galaxyCount}（ICRF→Fixed 锁定）`;
      } catch (err) {
        console.error(err);
        statusEl.classList.add("error");
        statusEl.textContent =
          "加载失败：请用本地 HTTP 服务打开本页（不能直接 file://）。详见 README。";
      }
    </script>
  </body>
</html>
